services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda
      POSTGRES_DB: tienda
    ports:
      # 5433 en el host porque el 5432 ya lo usa el PostgreSQL 18 local de Windows
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
